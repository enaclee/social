<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>enalcee</title>
<script src="https://kit.fontawesome.com/b617dc6679.js" crossorigin="anonymous"></script>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  background: black;
  font-family: 'Arial Black', sans-serif;
  overflow-x: hidden;
  user-select: none;
}

/* Загрузка */
#loader {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}
#loader span {
  font-size: 32px;
  color: white;
  text-shadow: 0 0 10px white, 0 0 30px #ccc;
  animation: flicker 1.2s infinite alternate;
}
@keyframes flicker {
  0% { opacity: 0.8; text-shadow: 0 0 6px white; }
  100% { opacity: 1; text-shadow: 0 0 14px white, 0 0 26px #ccc; }
}

/* Стартовый экран */
#start-screen {
  opacity: 0.6;
  display: none;
  justify-content: center;
  align-items: center;
  height: 100%;
  background: url('Picsart_25-07-06_12-49-05-878.jpg') center center no-repeat;
  background-size: 300%;
  animation: moveBG 40s ease-in-out infinite alternate;
  flex-direction: column;
  cursor: default;
}
@keyframes moveBG {
  0% { background-position: center center; }
  100% { background-position: 52% 48%; }
}
#start-screen h1 {
  font-size: 64px;
  color: white;
  text-shadow: 0 0 10px white, 0 0 30px #ccc;
  animation: flicker 1.5s infinite alternate;
  cursor: pointer;
  transition: transform 0.1s;
}
#start-screen h1:active {
  transform: scale(0.92);
}

/* Канвас для частиц */
#particle-canvas {
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
  display: none;
}

/* Оверлей плавного перехода */
#transition-overlay {
  position: fixed;
  inset: 0;
  background: black;
  z-index: 9997;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.6s ease;
}

/* Плавное появление bio */
#video-section {
  opacity: 0;
}
#video-section.fade-in {
  animation: fadeInBio 0.8s ease forwards;
}
@keyframes fadeInBio {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Видео и блок */
#video-section {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  height: 100%;
  position: relative;
}
video#mainVideo {
  position: fixed;
  top: 0; left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: 0;
  background: black;
}

/* Эффект сломанного ТВ */
#glitch {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 1;
  background: rgba(255,255,255,0.03);
  animation: glitchEffect 0.1s infinite;
}
@keyframes glitchEffect {
  0%   { opacity: 0.02; transform: translate(0,0); }
  10%  { opacity: 0.05; transform: translate(-2px,1px); }
  20%  { opacity: 0.03; transform: translate(1px,-1px); }
  30%  { opacity: 0.06; transform: translate(-1px,2px); }
  40%  { opacity: 0.04; transform: translate(2px,-2px); }
  50%  { opacity: 0.05; transform: translate(0,1px); }
  60%  { opacity: 0.03; transform: translate(-2px,0); }
  70%  { opacity: 0.06; transform: translate(1px,1px); }
  80%  { opacity: 0.04; transform: translate(-1px,-1px); }
  90%  { opacity: 0.05; transform: translate(2px,0); }
  100% { opacity: 0.03; transform: translate(0,0); }
}

/* Аватар с покачиванием */
#avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  overflow: hidden;
  margin-bottom: 16px;
  box-shadow: 0 0 12px white;
  position: relative;
  z-index: 2;
  animation: swing 4s ease-in-out infinite alternate;
}
#avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
@keyframes swing {
  0%   { transform: rotate(-5deg); }
  50%  { transform: rotate(5deg); }
  100% { transform: rotate(-5deg); }
}

/* Ник */
#username {
  font-size: 36px;
  color: #B497FF;
  text-shadow: 0 0 10px #B497FF, 0 0 20px #B497FF;
  animation: float 3s ease-in-out infinite alternate;
  margin-bottom: 16px;
  font-weight: bold;
  will-change: transform;
  z-index: 2;
}
@keyframes float {
  0%   { transform: translateY(0); }
  100% { transform: translateY(10px); }
}

/* Соцсети */
.social-box {
  margin-top: 40px;
  margin-bottom: 30px;
  padding: 10px 25px;
  max-width: 320px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  background: rgba(255,255,255,0.03);
  box-shadow: 0 0 6px white, 0 0 12px #ccc;
  z-index: 2;
}
.social-box a {
  font-size: 18px;
  color: #B497FF;
  text-decoration: none;
  padding: 6px 14px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  transition: background 0.3s ease;
  display: flex;
  align-items: center;
}
.social-box a i {
  margin-right: 8px;
}
.social-box a:hover {
  background: rgba(255,255,255,0.1);
}

/* Кнопка паузы */
#pause-button {
  font-size: 38px;
  color: black;
  text-shadow: none;
  cursor: pointer;
  margin-bottom: 24px;
  animation: none;
  z-index: 2;
  user-select: none;
  text-align: center;
}
#pause-button:focus {
  outline: none;
}

/* Футер */
footer {
  display: none; /* скрыт до старта видео */
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  color: black;
  font-weight: bold;
  text-shadow: none;
  z-index: 2;
}
footer a {
  text-decoration: none;
  color: #B497FF;
}

/* Статус — сообщение при клике */
#status-message {
  position: fixed;
  z-index: 9999;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 8px 14px;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  font-family: 'Arial', sans-serif;
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  white-space: nowrap;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  transform: translateX(-50%);
}
#status-message.visible {
  opacity: 1;
}

/* Статус online/offline */
#status-badge {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 5px 12px 5px 9px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  cursor: pointer;
}
#status-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
}
#status-dot.online {
  background: #3dff7a;
  box-shadow: 0 0 6px #3dff7a, 0 0 14px #3dff7a;
  animation: pulse-green 2s ease-in-out infinite;
}
#status-dot.offline {
  background: #ff4444;
  box-shadow: 0 0 6px #ff4444, 0 0 14px #ff4444;
  animation: pulse-red 2s ease-in-out infinite;
}
@keyframes pulse-green {
  0%, 100% { box-shadow: 0 0 5px #3dff7a, 0 0 12px #3dff7a; }
  50%       { box-shadow: 0 0 10px #3dff7a, 0 0 24px #3dff7a; }
}
@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 5px #ff4444, 0 0 12px #ff4444; }
  50%       { box-shadow: 0 0 10px #ff4444, 0 0 24px #ff4444; }
}
#status-text {
  font-size: 12px;
  font-family: 'Arial', sans-serif;
  font-weight: 600;
  letter-spacing: 0.04em;
  color: white;
}
</style>
</head>
<body>
<div id="loader">
  <span id="loading-text">Загрузка</span>
</div>

<div id="status-badge" onclick="toggleStatusMessage()">
  <div id="status-dot"></div>
  <span id="status-text"></span>
</div>
<div id="status-message"></div>

<canvas id="particle-canvas"></canvas>
<div id="transition-overlay"></div>

<div id="start-screen">
  <h1 onclick="startSite(event)">ТЫК</h1>
</div>

<div id="video-section">
  <video autoplay playsinline id="mainVideo">
    <source src="lv_0_20250706151148.mp4" type="video/mp4">
  </video>

  <div id="glitch"></div>

  <div id="avatar">
    <img src="Picsart_25-07-06_12-49-19-291.png" alt="avatar">
  </div>
  <div id="username">𓆩enaclee𓆪</div>
  <div class="social-box">
    <a href="https://www.faceit.com/en/players/enaclee" target="_blank">⊹ FACEIT</a>
    <a href="https://discord.gg/cTXAt7Gw" target="_blank"><i class="fab fa-discord"></i> Discord</a>
    <a href="https://steamcommunity.com/id/enaclee" target="_blank"><i class="fab fa-steam"></i> Steam</a>
    <a href="https://vk.com/sergeileonov" target="_blank"><i class="fab fa-vk"></i> VK</a>
    <a href="https://t.me/enaclee" target="_blank"><i class="fab fa-telegram"></i> Telegram</a>
    <a href="https://twitch.tv/enaclee" target="_blank"><i class="fab fa-twitch"></i> Twitch</a>
  </div>

  <div id="pause-button" onclick="togglePlayback()">×</div>
  <footer>© 2023 - 2028 Все права защищены — Контент защищён авторским правом.<br>Создатель 🖤 <a href="https://vk.com/sergeileonov" target="_blank">@sergeileonov</a></footer>
</div>

<script>
window.addEventListener("load", () => {
  setTimeout(() => {
    document.getElementById('loader').remove();
    document.getElementById('start-screen').style.display = 'flex';
  }, 3000);
});

function startSite(e) {
  const startScreen = document.getElementById('start-screen');
  const videoSection = document.getElementById('video-section');
  const video = document.getElementById('mainVideo');
  const footer = document.querySelector('footer');
  const canvas = document.getElementById('particle-canvas');
  const overlay = document.getElementById('transition-overlay');
  const ctx = canvas.getContext('2d');

  // Размер канваса
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';

  // Координаты клика
  const cx = e ? e.clientX : window.innerWidth / 2;
  const cy = e ? e.clientY : window.innerHeight / 2;

  // Создаём частицы
  const particles = [];
  const colors = ['#ffffff', '#B497FF', '#d4baff', '#cccccc', '#9966ff', '#eeeeee'];
  for (let i = 0; i < 120; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 9;
    const size = 2 + Math.random() * 5;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size,
      color: colors[Math.floor(Math.random() * colors.length)],
      alpha: 1,
      decay: 0.018 + Math.random() * 0.022,
      gravity: 0.18 + Math.random() * 0.12
    });
  }

  // Анимация частиц
  let frame = 0;
  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of particles) {
      if (p.alpha <= 0) continue;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.97;
      p.alpha -= p.decay;
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    frame++;
    // Через 18 кадров начинаем fade overlay
    if (frame === 18) {
      overlay.style.opacity = '1';
    }
    if (alive && frame < 80) {
      requestAnimationFrame(animateParticles);
    } else {
      // Показываем bio
      canvas.style.display = 'none';
      startScreen.style.display = 'none';
      videoSection.style.display = 'flex';
      videoSection.classList.add('fade-in');
      footer.style.display = 'block';
      video.play().catch(err => console.error("⚠️ Ошибка воспроизведения:", err));

      // Убираем overlay
      setTimeout(() => {
        overlay.style.opacity = '0';
      }, 100);
    }
  }

  animateParticles();
}

function togglePlayback() {
  const video = document.getElementById('mainVideo');
  const pauseBtn = document.getElementById('pause-button');
  const glitch = document.getElementById('glitch');

  if (video.paused) {
    video.play();
    pauseBtn.textContent = '×';
    glitch.style.animationPlayState = 'running';
  } else {
    video.pause();
    pauseBtn.textContent = '>';
    glitch.style.animationPlayState = 'paused';
  }
}

const loadingText = document.getElementById('loading-text');
let dots = 0;
setInterval(() => {
  dots = (dots + 1) % 4;
  loadingText.textContent = 'Загрузка' + '.'.repeat(dots);
}, 500);

// ======= СТАТУС ONLINE/OFFLINE =======
function updateStatus() {
  const hour = new Date().getHours();
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  if (hour >= 8 && hour < 22) {
    dot.className = 'online';
    text.textContent = 'online';
    text.style.textTransform = 'none';
  } else {
    dot.className = 'offline';
    text.textContent = 'offline';
    text.style.textTransform = 'none';
  }
}
updateStatus();
setInterval(updateStatus, 60000);

// ======= СООБЩЕНИЕ ПРИ КЛИКЕ НА СТАТУС =======
let statusMsgOpen = false;
let typewriterTimer = null;

function toggleStatusMessage() {
  const badge = document.getElementById('status-badge');
  const msg = document.getElementById('status-message');
  const hour = new Date().getHours();
  const isOnline = hour >= 8 && hour < 22;

  if (statusMsgOpen) {
    msg.classList.remove('visible');
    statusMsgOpen = false;
    if (typewriterTimer) clearTimeout(typewriterTimer);
    return;
  }

  // Позиционируем под бейджем по центру экрана
  const rect = badge.getBoundingClientRect();
  msg.style.top = (rect.bottom + 8) + 'px';
  msg.style.left = '50%';
  msg.textContent = '';
  msg.classList.add('visible');
  statusMsgOpen = true;

  const text = isOnline
    ? 'Утречко. Оно не неправильное. Оно просто есть'
    : 'Скорее всего, сплю. Но могу и не спать. А, неважно';

  let i = 0;
  function typeNext() {
    if (i < text.length) {
      msg.textContent += text[i];
      i++;
      typewriterTimer = setTimeout(typeNext, 38 + Math.random() * 30);
    }
  }
  typeNext();
}

</script>
</body>
</html>
